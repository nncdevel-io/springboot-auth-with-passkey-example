<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header">
    <div class="header-inner">
        <a href="/" class="header-logo">Passkey Demo</a>
        <nav th:if="${#authorization.expression('isAuthenticated()')}" class="header-nav">
            <div class="user-menu">
                <button class="user-menu-toggle" onclick="this.parentElement.classList.toggle('open')">
                    <span class="user-icon">&#9679;&#9679;&#9679;</span>
                    <span class="user-name" th:text="${#authentication.name}">user</span>
                </button>
                <div class="user-dropdown">
                    <a href="/profile" class="dropdown-item">Profile</a>
                    <form th:action="@{/logout}" method="post" class="dropdown-item">
                        <button type="submit">Logout</button>
                    </form>
                </div>
            </div>
        </nav>
    </div>
</header>

<footer th:fragment="footer">
    <p>Spring Boot Passkey (WebAuthn) Authentication Example</p>
</footer>

</body>
</html>
