<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Passkey Demo</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="page">
        <header>
            <div class="header-inner">
                <span class="header-logo">Passkey Demo</span>
            </div>
        </header>
        <main class="container">
            <div class="login-section">
                <h2>Sign In</h2>

                <div th:if="${param.error}" class="alert alert-error">
                    <p>Invalid username or password.</p>
                </div>
                <div th:if="${param.logout}" class="alert alert-success">
                    <p>You have been logged out.</p>
                </div>

                <div class="demo-credentials">
                    <p><strong>Demo Account</strong></p>
                    <p>Username: <code>user</code> / Password: <code>password</code></p>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" autofocus required />
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required />
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Sign In</button>
                </form>

                <div class="passkey-section">
                    <div class="divider"><span>or</span></div>
                    <button id="passkey-signin" class="btn btn-secondary btn-full">Sign in with a passkey</button>
                </div>
            </div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>

    <script src="/js/webauthn-utils.js"></script>
    <script>
    document.getElementById('passkey-signin').addEventListener('click', async function() {
        try {
            var headers = getCsrfHeaders();

            var optRes = await postJson('/webauthn/authenticate/options', headers);
            if (!optRes.ok) throw new Error('HTTP ' + optRes.status);
            var options = await optRes.json();

            var decodedAllowCredentials = !options.allowCredentials ? [] :
                options.allowCredentials.map(function(c) {
                    return Object.assign({}, c, { id: base64urlDecode(c.id) });
                });
            var publicKeyOptions = Object.assign({}, options, {
                allowCredentials: decodedAllowCredentials,
                challenge: base64urlDecode(options.challenge)
            });

            var cred = await navigator.credentials.get({ publicKey: publicKeyOptions });

            var userHandle;
            if (cred.response.userHandle) {
                userHandle = base64urlEncode(cred.response.userHandle);
            }
            var body = {
                id: cred.id,
                rawId: base64urlEncode(cred.rawId),
                response: {
                    authenticatorData: base64urlEncode(cred.response.authenticatorData),
                    clientDataJSON: base64urlEncode(cred.response.clientDataJSON),
                    signature: base64urlEncode(cred.response.signature),
                    userHandle: userHandle
                },
                credType: cred.type,
                clientExtensionResults: cred.getClientExtensionResults(),
                authenticatorAttachment: cred.authenticatorAttachment
            };

            var authRes = await postJson('/login/webauthn', headers, body);
            if (!authRes.ok) throw new Error('HTTP ' + authRes.status);
            var result = await authRes.json();
            if (result && result.authenticated && result.redirectUrl) {
                window.location.href = result.redirectUrl;
            } else {
                throw new Error('Authentication response invalid');
            }
        } catch (e) {
            if (e.name !== 'NotAllowedError') {
                console.error('WebAuthn authentication error:', e);
                window.location.href = '/login?error';
            }
        }
    });
    </script>
</body>
</html>
